<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f4fbf">
<meta name="description" content="Just Disc Golf: track your discs and practice distance, accuracy and putting.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="JDG">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Just Disc Golf</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Figtree:wght@400;500;600&display=swap">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}body{margin:0;font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<style>
/* Layout: app shell — sticky header, one scrolling column, bottom tab bar like a phone app. Fairway greens, disc-plastic orange. */
:root{
  --bg:#f3f5ef; --surface:#ffffff; --sunk:#e7ebe0; --fg:#18241c; --muted:#5f6d62; --line:#d5dccd;
  --green:#1f5a3a; --green-ink:#ffffff; --accent:#e8631c; --accent-soft:#fde5d6;
  --good:#2f8a4e; --warn:#b7791f; --bad:#b83a32;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:10px; --royal:#1f4fbf; --royal-ink:#ffffff; --royal-text:#1f4fbf;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1712; --surface:#17221b; --sunk:#1f2c24; --fg:#e6ede6; --muted:#9aab9e; --line:#2b3a30;
  --green:#2c7a50; --green-ink:#ffffff; --accent:#f37a37; --accent-soft:#3a2416;
  --good:#5cc27f; --warn:#e0a84a; --bad:#ec6c62; --royal-text:#8fb0ff; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1712; --surface:#17221b; --sunk:#1f2c24; --fg:#e6ede6; --muted:#9aab9e; --line:#2b3a30;
  --green:#2c7a50; --green-ink:#ffffff; --accent:#f37a37; --accent-soft:#3a2416;
  --good:#5cc27f; --warn:#e0a84a; --bad:#ec6c62; --royal-text:#8fb0ff; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--royal)}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--royal);color:var(--royal-ink);
  padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.hwrap{max-width:720px;margin:0 auto;display:flex;align-items:baseline;gap:10px}
.logo{font-family:var(--display);font-weight:800;font-size:28px;letter-spacing:.02em;line-height:1}
.logo b{color:inherit}
.sub{font-size:13px;opacity:.9}
main{max-width:720px;margin:0 auto;padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:16px}
h2{font-family:var(--display);font-weight:700;font-size:24px;margin:0;letter-spacing:.01em;text-wrap:balance}
h3{font-family:var(--display);font-weight:700;font-size:19px;margin:0;letter-spacing:.02em;text-transform:uppercase}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.muted{color:var(--muted)} .small{font-size:13px}
.num{font-variant-numeric:tabular-nums}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:12px}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 14px;font-weight:600}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.ghost{background:transparent;border-color:transparent;color:var(--muted);padding:6px 8px}
.danger{color:var(--bad)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chip{flex:none;border-radius:999px;padding:6px 12px;font-size:13px;background:var(--sunk);border-color:transparent;font-weight:600;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--green);color:var(--green-ink)}
.chip .c{opacity:.7;margin-left:4px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--sunk);border-radius:10px;padding:4px;gap:4px}
.seg button{border:0;background:transparent;color:var(--muted);font-family:var(--display);font-size:17px;letter-spacing:.04em;text-transform:uppercase;padding:8px 4px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.12)}
form.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
form .full{grid-column:1/-1}
label{display:grid;gap:4px;font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;min-width:0}
input,select{width:100%;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;font-size:16px;text-transform:none;letter-spacing:0;font-weight:400;color:var(--fg)}
.list{display:grid;gap:5px}
.disc{background:var(--surface);border:1px solid var(--line);border-radius:8px;display:grid}
.dhead{padding:7px 10px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;cursor:pointer;border-radius:8px}
.chev{color:var(--muted);transition:transform .15s}
.disc.open .chev{transform:rotate(180deg)}
.dexp{border-top:1px solid var(--line);padding:10px;display:grid;gap:10px}
.dexp-actions .confirm{width:100%}
.fn4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.fn4>div{background:var(--sunk);border-radius:8px;padding:6px 4px;text-align:center;display:grid}
.fn4 strong{font-family:var(--display);font-size:24px;line-height:1.1}
.k{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.ddl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 12px}
.dd{display:grid;gap:1px;min-width:0;font-size:14px}
.dd>span:last-child{overflow-wrap:anywhere}
.cname{display:inline-flex;align-items:center;margin-right:8px}
.dnote p{margin:2px 0 0;white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px}
.disc #discForm{border:0;border-top:1px solid var(--line);border-radius:0 0 8px 8px;background:transparent}
.dtop{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 7px;min-width:0}
.dtop>span+span::before{content:"·";color:var(--muted);margin-right:7px;font-weight:400}
.dtype{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--royal-text)}
.dtop .dname{font-size:15px}
.dtop .plas,.dtop .stab{font-size:13px;color:var(--muted);text-transform:none;letter-spacing:0;font-weight:500}
.dmeta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:4px}
.dmeta .dot{margin-right:0;width:18px;height:18px;vertical-align:middle;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.disc .ghost{padding:6px 6px;font-size:13px}
.sortbar{gap:8px;flex-wrap:nowrap}
.sortlbl{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.sortbar select{width:auto;flex:1;max-width:180px;padding:7px 8px;font-size:15px}
.dirbtn{white-space:nowrap;font-size:13px}
.nums{display:grid;grid-template-columns:repeat(4,auto);gap:3px;font-family:var(--display);font-weight:700;font-size:16px;justify-content:start}
.nums span{background:var(--sunk);border-radius:5px;min-width:24px;text-align:center;padding:1px 3px;font-variant-numeric:tabular-nums;line-height:1.3}
.nums span:first-child{background:var(--accent-soft);color:var(--accent)}
.dname{font-weight:600;font-size:16px;overflow-wrap:anywhere}
.tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border-radius:4px;padding:2px 6px;background:var(--sunk);color:var(--muted)}
.st-bag{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good)}
.st-shelf{background:var(--sunk);color:var(--muted)}
.st-found{background:color-mix(in srgb,var(--warn) 20%,transparent);color:var(--warn)}
.st-stolen{background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad)}
.st-sold{background:color-mix(in srgb,var(--muted) 18%,transparent);color:var(--muted)}
.stab{font-size:12px;color:var(--muted)}
.numwrap{display:flex;gap:3px;min-width:0}
.numwrap .pm{flex:none;padding:0 6px;font-size:16px}
.flight4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.flight4 input{text-align:center;padding:9px 2px;min-width:0}
.flight4 label{letter-spacing:.03em}
.dhead:hover{background:color-mix(in srgb,var(--royal) 5%,transparent)}
.dhead:active{background:var(--sunk)}
.dhead:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.disc.open{border-color:var(--royal);box-shadow:0 0 0 2px color-mix(in srgb,var(--royal) 25%,transparent)}
.disc.flash{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.colorpick{border:0;padding:0;margin:0;display:flex;flex-wrap:wrap;gap:6px;min-width:0}
.colorpick legend{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;padding:0;margin-bottom:6px}
.colorpick legend .muted{text-transform:none;letter-spacing:0;font-weight:400}
.cchip{display:inline-flex;align-items:center;gap:0;padding:6px 10px;border:1px solid var(--line);border-radius:999px;font-size:14px;font-weight:500;text-transform:none;letter-spacing:0;color:var(--fg);cursor:pointer;background:var(--bg)}
.cchip input{position:absolute;opacity:0;width:1px;height:1px}
.cchip:has(input:checked){border-color:var(--accent);background:var(--accent-soft);font-weight:700}
.cchip:has(input:focus-visible){outline:3px solid var(--accent);outline-offset:2px}
.cstyle{display:grid;gap:6px}
.cstyle-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.dot.dotprev{width:34px;height:34px;margin:0;border:1px solid var(--line)}
.cs-opt{display:inline-flex;align-items:center;gap:5px;font-size:14px;font-weight:600;color:var(--fg);text-transform:none;letter-spacing:0;cursor:pointer}
.cs-opt input{width:18px;height:18px;accent-color:var(--accent)}
.cs-rim{display:inline-flex;align-items:center;gap:6px;font-size:14px;text-transform:none;letter-spacing:0;color:var(--fg)}
.cs-rim select{width:auto;padding:6px 8px}
.cnew{border-style:dashed;color:var(--muted);background:transparent;font-weight:600}
.cwheelbox{width:100%;display:grid;gap:10px;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--bg)}
.cwname{display:grid;gap:4px}
.cwrow{display:grid;grid-template-columns:minmax(0,1fr) 76px;gap:12px;align-items:center}
.cwheel{position:relative;width:100%;max-width:220px;aspect-ratio:1;justify-self:center}
.cwheel canvas{width:100%;height:100%;display:block;border-radius:50%;touch-action:none;cursor:crosshair}
.cwmark{position:absolute;width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1.5px rgba(0,0,0,.6),0 2px 6px rgba(0,0,0,.35);pointer-events:none}
.cwside{display:grid;gap:6px;justify-items:center}
.cwprev{width:64px;height:64px;border-radius:50%;border:1px solid var(--line);box-shadow:inset 0 0 0 3px var(--surface)}
.cwshades{display:grid;grid-template-columns:repeat(2,30px);gap:6px}
.cwshade{width:30px;height:30px;padding:0;border-radius:50%;border:1px solid var(--line)}
.cwshade.on{outline:3px solid var(--accent);outline-offset:1px}
.cmanage{width:100%;text-align:left;padding:4px 0}
.cmgr{display:flex;flex-wrap:wrap;gap:6px;width:100%}
.cmgr .cchip{padding-right:2px}
.cmgr .ghost{padding:2px 6px}
textarea{width:100%;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;font:inherit;font-size:16px;color:var(--fg);resize:vertical;text-transform:none;letter-spacing:0;font-weight:400}
textarea:focus{border-color:var(--accent);background:var(--surface)}
.fnotes summary{cursor:pointer;font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;list-style:none;display:flex;align-items:center;gap:6px;padding:4px 0}
.fnotes summary .muted{text-transform:none;letter-spacing:0;font-weight:400}
.fnotes summary::-webkit-details-marker{display:none}
.fnotes summary::after{content:"▸";transition:transform .15s}
.fnotes[open] summary::after{transform:rotate(90deg)}
.fnotes textarea{margin-top:4px}
.dnotes{margin-top:4px;font-size:13px}
.dnotes summary{cursor:pointer;color:var(--muted);font-weight:600;list-style:none;display:inline-flex;align-items:center;gap:4px}
.dnotes summary::-webkit-details-marker{display:none}
.dnotes summary::after{content:"▸";transition:transform .15s}
.dnotes[open] summary::after{transform:rotate(90deg)}
.dnotes p{margin:4px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}
.acesf .numwrap input{text-align:center;max-width:90px}
.acesf .pm{width:44px;padding:0}
.acerow{display:flex;align-items:center;gap:8px}
.acerow strong{font-family:var(--display);font-size:22px;line-height:1}
.aceadd{border:1px solid var(--line);padding:3px 10px;font-size:13px;color:var(--fg)}
.acebadge{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:#fff;background:var(--accent);border-radius:4px;padding:1px 6px}
.secbar{display:flex;align-items:center;gap:6px;min-width:0}
.secbar .chips{flex:1;min-width:0}
.secbar .chip{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.secbar .chips.sorting{scroll-behavior:auto}
.chip.dragging{background:var(--accent)!important;color:#fff!important;transform:scale(1.08);box-shadow:0 4px 12px rgba(0,0,0,.25);position:relative;z-index:2}
.chartlink{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:color-mix(in srgb,var(--royal) 8%,var(--surface));border-color:color-mix(in srgb,var(--royal) 35%,var(--line));color:var(--royal-text);font-weight:700;padding:10px 12px}
.chartlink .small{font-weight:400;margin-left:4px}
.chartgo{margin-left:auto;font-size:20px;line-height:1}
.sechint{font-size:12px;color:var(--muted);margin-top:-8px}
.chip.secadd{background:var(--royal);color:var(--royal-ink);font-size:18px;line-height:1;padding:5px 14px}
.secname{display:flex;align-items:center;gap:8px}
.alltog{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:500;color:var(--fg);text-transform:none;letter-spacing:0;cursor:pointer;margin-top:-6px}
.alltog input{position:absolute;opacity:0;width:1px;height:1px}
.alltog .sw{width:36px;height:20px;border-radius:99px;background:var(--line);position:relative;transition:background .15s;flex:none}
.alltog .sw::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.3);transition:transform .15s}
.alltog input:checked+.sw{background:var(--good)}
.alltog input:checked+.sw::after{transform:translateX(16px)}
.alltog input:focus-visible+.sw{outline:3px solid var(--accent);outline-offset:2px}
.chip.notall{border:1px dashed var(--muted)}
.secmove{display:grid;gap:4px}
.secname input{flex:1;font-weight:600;padding:7px 10px}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;border:1px solid var(--line);margin-right:7px;vertical-align:-1px}
.empty{text-align:center;padding:24px 12px;color:var(--muted);border:1.5px dashed var(--line);border-radius:var(--r)}
.empty strong{display:block;color:var(--fg);font-family:var(--display);font-size:20px;margin-bottom:4px}
.log{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.log:first-child{border-top:0}
.big{font-family:var(--display);font-weight:700;font-size:24px;font-variant-numeric:tabular-nums}
.big small{font-size:14px;color:var(--muted);margin-left:2px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.stat{background:var(--sunk);border-radius:8px;padding:10px}
.stat .k{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
.putt{display:grid;grid-template-columns:58px minmax(0,1fr) minmax(0,150px);gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.putt-head{padding:0;border:0;text-transform:uppercase;letter-spacing:.06em;font-weight:700;font-size:11px}
.putt-head span:last-child{text-align:center}
.pin{text-align:center;font-size:18px;font-weight:600;padding:8px 4px}
.throws{display:grid;gap:6px}
.setup{border-color:color-mix(in srgb,var(--royal) 45%,var(--line))}
.startbtn{width:100%;padding:14px;font-family:var(--display);font-size:20px;letter-spacing:.04em;text-transform:uppercase}
.pdwrap{display:flex;align-items:baseline;gap:2px}
.pdwrap .pdist{width:100%;min-width:0;font-family:var(--display);font-weight:800;font-size:20px;padding:5px 2px;text-align:center}
.pdwrap small{font-size:11px;color:var(--muted);font-weight:600}
.samebox{gap:8px}
.sametotal{font-size:15px;font-variant-numeric:tabular-nums}
.sametotal strong{font-family:var(--display);font-size:20px;color:var(--royal-text)}
.backup summary{cursor:pointer;list-style:none;display:flex;align-items:center;justify-content:space-between}
.backup summary::-webkit-details-marker{display:none}
.backup summary::after{content:"▾";color:var(--muted)}
.backup:not([open]) summary::after{content:"▸"}
.backup[open]{display:grid}
.backup textarea{font-family:ui-monospace,monospace;font-size:12px}
.filebtn{position:relative;display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:8px;padding:9px 14px;font-weight:600;font-size:15px;text-transform:none;letter-spacing:0;color:var(--fg);cursor:pointer;background:var(--surface)}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.quicklog{gap:8px;padding:10px 12px;scroll-margin-top:8px}
.qthrow{width:auto;padding:5px 8px;font-size:15px}
.qline{display:grid;grid-template-columns:96px minmax(0,1fr);gap:6px;align-items:center}
.qwrap{display:flex;align-items:baseline;gap:3px}
.qwrap small{color:var(--muted);font-weight:600}
.qdist::-webkit-outer-spin-button,.qdist::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.qdist{-moz-appearance:textfield;appearance:textfield}
.qdist{font-family:var(--display);font-size:26px;font-weight:800;padding:5px 6px;text-align:center;min-width:0}
.qline select{padding:10px 6px;font-size:15px}
.qsave{padding:11px 14px}
.quicklog label .muted{text-transform:none;letter-spacing:0;font-weight:400}
.surows{display:grid;gap:6px}
.surow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) 36px;gap:8px;align-items:center}
.suhead{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.ptab{display:grid}
.prow{display:grid;grid-template-columns:72px 64px 64px minmax(0,1fr);gap:8px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
.prow.phead{border-top:0;padding-top:0;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.prow.phead span:nth-child(2),.prow.phead span:nth-child(3){text-align:center}
.prow.phead span:last-child,.ppct{text-align:right}
.pft{font-family:var(--display);font-weight:800;font-size:22px;line-height:1}
.pft small{font-size:12px;color:var(--muted);font-weight:600;margin-left:1px}
.prow .pin{font-size:17px;padding:7px 4px}
.ppct{display:grid;line-height:1.15}
.ppct strong{font-family:var(--display);font-size:20px}
.ppct small{font-size:11px;color:var(--muted)}
.putters{grid-template-columns:auto minmax(0,140px);align-items:center;gap:12px;justify-content:start;font-size:14px;color:var(--fg)}
.throws .pbtns button{flex:1;width:auto;height:36px}
.putt:first-child{border-top:0}

<header><div class="hwrap"><div class="logo">J<b>D</b>G</div><div class="sub">Just Disc Golf</div></div></header>
<main id="app"></main>
<nav class="tabs" aria-label="Sections">
  <button id="tab-bag" data-tab="bag" aria-current="page">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="5" y="7" width="14" height="14" rx="2"/><path d="M9 7V5a3 3 0 0 1 6 0v2"/><path d="M8 12h8"/></svg>Bag</button>
  <button id="tab-practice" data-tab="practice">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3v15"/><path d="M6 6h12l-2 5H8z"/><path d="M8 18h8"/><path d="M12 18l-3 3M12 18l3 3"/></svg>Practice</button>
  <button id="tab-results" data-tab="results">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20h16"/><rect x="6" y="11" width="3" height="6"/><rect x="11" y="6" width="3" height="11"/><rect x="16" y="13" width="3" height="4"/></svg>Results</button>
</nav>
<div id="typebar" class="typebar" hidden aria-hidden="true"><span class="tb-l"></span><span class="tb-v"></span></div>
<div id="toast" class="toast" hidden></div>

<script>
const STATUSES=[["bag","In the bag"],["shelf","Shelf"],["found","Found"],["stolen","Stolen"],["sold","Sold"]];
const secObjs=()=>{const c=S.settings.sections;return Array.isArray(c)&&c.length?c.map(x=>({...x})):STATUSES.map(([key,label])=>({key,label}))};
const sections=()=>secObjs().map(x=>[x.key,x.label]);
const inAll=k=>{const o=secObjs().find(x=>x.key===k);return !o||o.all!==false};
const allDiscs=()=>S.discs.filter(d=>inAll(d.status));
const DISC_TYPES=["Driver","Fairway","Midrange","Putter"];
const STABILITY=["Overstable","Stable","Straight","Understable","Very understable"];
const THROWS=["Backhand","Forehand","Tomahawk","Thumber","Roller","Overhand","Hyzer","Anhyzer"];
const DEFAULT_PUTTS=[15,20,25,30];
const DEFAULT_ACC=[150,200,250,300,350,400];
const DEFAULT_ACC_HEADS={throws:"Throws",c1:"Circle 1",c2:"Circle 2",closest:"Closest"};
const COLORS=[["Red","#d63b2f"],["Orange","#ee7a22"],["Yellow","#f2c81c"],["Green","#3aa655"],["Blue","#2f6fd6"],["Purple","#7d4bc4"],["Pink","#e45c9b"],["White","#f7f7f2"],["Black","#1c1c1c"],["Gray","#8d948f"],["Clear","#dde2de"],["Glow","#d8f5a8"]];
const COLORS_AZ=COLORS.slice().sort((a,b)=>a[0].localeCompare(b[0]));
const discColors=d=>Array.isArray(d.colors)?d.colors:(d.color?[d.color]:[]);
const customColors=()=>Array.isArray(S.settings.customColors)?S.settings.customColors:[];
const allColors=()=>COLORS.concat(customColors().filter(c=>!COLORS.some(b=>b[0].toLowerCase()===String(c.name).toLowerCase())).map(c=>[c.name,c.hex])).sort((a,b)=>a[0].localeCompare(b[0]));
const colorVal=n=>(allColors().find(c=>c[0]===n)||[])[1];
const statusLabel=s=>(sections().find(x=>x[0]===s)||STATUSES.find(x=>x[0]===s)||[s,s])[1];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const today=()=>new Date().toISOString().slice(0,10);
const fmtDate=d=>{try{return new Date(d+"T12:00:00").toLocaleDateString(undefined,{month:"short",day:"numeric"})}catch(e){return d}};
const pct=(m,a)=>a?Math.round(m/a*100):0;

/* ---------- storage: artifact db, with browser storage fallback ---------- */
const COLLS=["discs","distance","accuracy","putts"];
const S={discs:[],distance:[],accuracy:[],putts:[],settings:{putDistances:DEFAULT_PUTTS.slice()}};
let db=null, readOnly=false;
const LKEY="jdg-v1";
function localLoad(){try{const v=JSON.parse(localStorage.getItem(LKEY)||"null");if(v)Object.assign(S,v)}catch(e){}}
function localSave(){try{localStorage.setItem(LKEY,JSON.stringify(S))}catch(e){}}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);

async function addRec(coll,data){
  data.created=Date.now();
  const id=uid();Object.keys(data).forEach(k=>{if(data[k]===null||data[k]===undefined)delete data[k]});
  if(db){S[coll]=S[coll].concat([{id,...data}]);
    try{await db.collection(coll).doc(id).set(data);return id}catch(e){S[coll]=S[coll].filter(x=>x.id!==id);return fail(e)}}
  data.id=id;S[coll].push(data);localSave();render();return id;
}
async function updRec(coll,id,data){
  if(db){try{await db.collection(coll).doc(id).update(data);return true}catch(e){return fail(e)}}
  const r=S[coll].find(x=>x.id===id);if(r)Object.assign(r,data);localSave();render();return true;
}
async function delRec(coll,id){
  if(db){try{await db.collection(coll).doc(id).delete();return true}catch(e){return fail(e)}}
  S[coll]=S[coll].filter(x=>x.id!==id);localSave();render();return true;
}
async function saveSettings(){
  if(db){try{await db.doc("settings/main").set(S.settings)}catch(e){fail(e)}}
  else{localSave()}
  render();
}
function fail(e){
  if(e&&e.code==="invalid_argument"){readOnly=true;toast("This copy is view-only");}
  else if(e&&e.code==="quota_exceeded"){toast("Storage is full. Delete some old entries.");}
  else toast("Couldn't save ("+(e&&e.code||"error")+"). Try again.");
  render();return false;
}

let tt;function toast(m){const t=document.getElementById("toast");t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,2200)}

/* ---------- UI state ---------- */
const U={sort:"speed",sortDir:"desc",tab:"bag",filter:"bag",practice:"distance",editDisc:null,showDiscForm:false,confirm:null,
  session:{},editingPutts:false,distDraft:null,acc:{},editingAcc:false,accDraft:null,dRows:[],dThrow:"Backhand",dDate:null};
const blankRows=(n,disc="")=>Array.from({length:n},()=>({dist:"",disc}));
U.dRows=blankRows(5);
try{const v=JSON.parse(localStorage.getItem("jdg-ui")||"null");if(v){U.tab=v.tab||U.tab;U.practice=v.practice||U.practice;U.filter=v.filter||U.filter;U.sort=v.sort||U.sort;U.sortDir=v.sortDir||U.sortDir}}catch(e){}
const rememberUI=()=>{try{localStorage.setItem("jdg-ui",JSON.stringify({tab:U.tab,practice:U.practice,filter:U.filter,sort:U.sort,sortDir:U.sortDir}))}catch(e){}};
if(["bag","practice","results"].includes(location.hash.slice(1)))U.tab=location.hash.slice(1);

/* ---------- render ---------- */
const app=document.getElementById("app");
function render(){
  document.querySelectorAll("nav.tabs button").forEach(b=>b.setAttribute("aria-current",!U.view&&b.dataset.tab===U.tab?"page":"false"));
  const cb=document.getElementById("chartBtn");if(cb)cb.setAttribute("aria-pressed",U.view==="chart");
  app.innerHTML=U.view==="chart"?chartView():U.tab==="bag"?bagView():U.tab==="results"?resultsView():practiceView();
  app.querySelectorAll("input").forEach(i=>i.setAttribute("autocomplete","off"));
  if(document.getElementById("c-wheel"))drawWheel();
}

function discOptions(sel,show){
  const usable=allDiscs().filter(d=>d.status!=="sold"&&d.status!=="stolen").sort((a,b)=>(b.speed||0)-(a.speed||0));
  return `<option value="">Choose a disc</option>`+usable.map(d=>`<option value="${esc(d.id)}" ${sel===d.id?"selected":""}>${esc(d.name)}${show==="color"?(discColors(d).length?" · "+esc(discColors(d).join("/")):""):(d.plastic?" · "+esc(d.plastic):"")}</option>`).join("");
}
const discName=id=>{if(!id)return "No disc";const d=S.discs.find(x=>x.id===id);return d?d.name:"Deleted disc"};
const closestName=v=>typeof v==="number"?v+" ft":discName(v);

function bagView(){
  const SEC=sections();
  const counts=Object.fromEntries(SEC.map(([k])=>[k,S.discs.filter(d=>d.status===k).length]));
  const list=sortDiscs(U.filter==="all"?allDiscs():S.discs.filter(d=>d.status===U.filter));
  const showForm=U.showDiscForm&&!U.editDisc;
  return `
  <div class="row between"><h2>My discs</h2>${readOnly?"":`<button class="primary" data-act="newDisc">+ Add disc</button>`}</div>
  <div class="secbar"><div class="chips" role="group" aria-label="Sections">
    <button class="chip" data-filter="all" aria-pressed="${U.filter==="all"}">All<span class="c">${allDiscs().length}</span></button>
    ${SEC.map(([k,l])=>`<button class="chip${inAll(k)?"":" notall"}" data-filter="${esc(k)}" aria-pressed="${U.filter===k}" ${inAll(k)?"":`title="Not counted in All"`}>${esc(l)}<span class="c">${counts[k]||0}</span></button>`).join("")}
    ${readOnly?"":`<button class="chip secadd" data-act="addSection" aria-label="Add a section">+</button>`}
  </div></div>
  ${readOnly?"":`<div class="sechint">Hold a section and slide it to reorder.</div>`}
  <button class="chartlink" data-act="openChart"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 21c0-6 6-8 6-13a4 4 0 0 0-8 0"/><circle cx="12" cy="21" r="1"/></svg>Flight chart<span class="small muted">See how your discs fly</span><span aria-hidden="true" class="chartgo">›</span></button>
  ${U.filter!=="all"&&!readOnly&&SEC.some(x=>x[0]===U.filter)?`<div class="secname"><label for="sec-name" class="sortlbl">Section name</label><input id="sec-name" data-secname="${esc(U.filter)}" maxlength="30" value="${esc(statusLabel(U.filter))}" aria-label="Section name">
    ${U.confirm!=="delsec"&&SEC.length>1?`<button class="ghost danger" data-act="askDelSection" aria-label="Delete this section">Delete</button>`:""}</div>
  <label class="alltog"><input type="checkbox" id="sec-all" data-secall="${esc(U.filter)}" ${inAll(U.filter)?"checked":""}><span class="sw" aria-hidden="true"></span>Include this section in All</label>
  ${U.confirm==="delsec"?`<div class="ask" role="alertdialog"><span><strong>Delete the “${esc(statusLabel(U.filter))}” section?</strong>${counts[U.filter]?` It has ${counts[U.filter]} disc${counts[U.filter]===1?"":"s"} in it.`:""}</span>
    ${counts[U.filter]?`<label class="secmove">Move its discs to<select id="sec-move">${SEC.filter(([k])=>k!==U.filter).map(([k,l])=>`<option value="${esc(k)}">${esc(l)}</option>`).join("")}<option value="__delete">Delete the discs too</option></select></label>`:""}
    <div class="row"><button class="ghost" data-act="cancel">No, keep it</button><button class="dangerbtn" data-act="delSection">Yes, delete</button></div></div>`:""}`:""}
  <div class="row sortbar"><label for="sortby" class="sortlbl">Sort</label>
    <select id="sortby" data-sort="1">${SORTS.map(([k,l])=>`<option value="${k}" ${U.sort===k?"selected":""}>${l}</option>`).join("")}</select>
    <button class="ghost dirbtn" data-act="sortDir" aria-label="Sort ${U.sortDir==="desc"?"descending":"ascending"}, tap to flip">${U.sortDir==="desc"?"↓ High–low":"↑ Low–high"}</button></div>
  ${showForm?discForm(null):""}
  <div class="list">
  ${list.length?list.map(discRow).join(""):`<div class="empty"><strong>${S.discs.length?"Nothing here yet":"Your bag is empty"}</strong>${S.discs.length?"No discs have this status.":"Tap “Add disc” to log your first one with its plastic, flight numbers and stability."}</div>`}
  </div>`;
}
const SORTS=[["name","Name"],["type","Type"],["speed","Speed"],["glide","Glide"],["turn","Turn"],["fade","Fade"],["color","Color"]];
function sortDiscs(list){
  const k=U.sort||"speed",dir=U.sortDir==="asc"?1:-1,byName=(a,b)=>String(a.name||"").localeCompare(String(b.name||""));
  return list.slice().sort((a,b)=>{
    if(k==="name")return dir*byName(a,b);
    if(k==="type"){const ia=DISC_TYPES.indexOf(a.type),ib=DISC_TYPES.indexOf(b.type);if(ia<0&&ib<0)return byName(a,b);if(ia<0)return 1;if(ib<0)return -1;return dir*(ia-ib)||(b.speed||0)-(a.speed||0)}
    if(k==="color"){const ca=discColors(a)[0],cb=discColors(b)[0];if(!ca&&!cb)return byName(a,b);if(!ca)return 1;if(!cb)return -1;return dir*ca.localeCompare(cb)||byName(a,b)}
    const va=a[k],vb=b[k];const na=va==null||va==="",nb=vb==null||vb==="";if(na&&nb)return byName(a,b);if(na)return 1;if(nb)return -1;
    return dir*(+va-+vb)||byName(a,b)});
}
function openDisc(id){
  U.discDraft=null;U.copying=null;U.colorAdd=null;U.editDisc=null;U.showDiscForm=false;U.confirm=null;
  U.expand=U.expand===id?null:id;render();
  if(U.expand)setTimeout(()=>{const el=document.querySelector(`.disc[data-id="${CSS.escape(id)}"]`);if(!el)return;const r=el.getBoundingClientRect();if(r.top<70||r.bottom>window.innerHeight-90)el.scrollIntoView({block:"start",behavior:"smooth"})},30);
}
function discLog(d){const L=S.distance.filter(l=>l.disc===d.id&&l.distance>0);if(!L.length)return "";const mx=Math.max(...L.map(l=>l.distance)),av=Math.round(L.reduce((s,l)=>s+l.distance,0)/L.length);
  return `<div class="dd"><span class="k">Practice</span><span>Longest ${mx} ft · avg ${av} ft · ${L.length} throw${L.length===1?"":"s"}</span></div>`}
function discDetail(d){
  const conf=U.confirm==="disc:"+d.id,cols=discColors(d);
  const nums=[["Speed",d.speed],["Glide",d.glide],["Turn",d.turn],["Fade",d.fade]];
  return `<div class="dexp">
    ${readOnly?"":`<div class="row between dexp-actions">
      ${conf?`<div class="confirm"><span class="small"><strong>Delete ${esc(d.name)}?</strong></span><button class="dangerbtn" data-act="delDisc" data-id="${esc(d.id)}">Yes, delete</button><button class="ghost" data-act="cancel">No</button></div>`
        :`<button class="primary" data-act="editDisc" data-id="${esc(d.id)}">Edit disc</button>
        <div class="row" style="gap:2px"><button class="ghost" data-act="copyDisc" data-id="${esc(d.id)}">Copy</button><button class="ghost danger" data-act="askDel" data-id="${esc(d.id)}">Delete</button></div>`}

function hsvHex(h,s,v){const f=n=>{const k=(n+h/60)%6;return v-v*s*Math.max(0,Math.min(k,4-k,1))};return "#"+[f(5),f(3),f(1)].map(x=>Math.round(x*255).toString(16).padStart(2,"0")).join("")}

function drawWheel(){const cv=document.getElementById("c-wheel");if(!cv)return;const ctx=cv.getContext("2d"),W=cv.width,R=W/2,img=ctx.createImageData(W,W);
  for(let y=0;y<W;y++)for(let x=0;x<W;x++){const dx=x-R,dy=y-R,r=Math.hypot(dx,dy),i=(y*W+x)*4;if(r>R){img.data[i+3]=0;continue}
    const h=(Math.atan2(dy,dx)*180/Math.PI+360)%360,sv=r/R,hx=hsvHex(h,sv,1);img.data[i]=parseInt(hx.slice(1,3),16);img.data[i+1]=parseInt(hx.slice(3,5),16);img.data[i+2]=parseInt(hx.slice(5,7),16);img.data[i+3]=r>R-1.5?Math.round((R-r)/1.5*255):255}
  ctx.putImageData(img,0,0);updWheel()}
function updWheel(){const c=U.colorAdd;if(!c)return;const m=document.getElementById("c-mark"),p=document.getElementById("c-prev"),sh=document.getElementById("c-shades");
  if(m){const a=c.h*Math.PI/180;m.style.left=(50+Math.cos(a)*c.s*50)+"%";m.style.top=(50+Math.sin(a)*c.s*50)+"%"}
  if(p)p.style.background=c.hex;if(sh)sh.innerHTML=shadeBtns()}
function pickWheel(e){const cv=document.getElementById("c-wheel"),c=U.colorAdd;if(!cv||!c)return;const r=cv.getBoundingClientRect(),pt=e.touches?e.touches[0]:e;
  const dx=(pt.clientX-r.left)/r.width*2-1,dy=(pt.clientY-r.top)/r.height*2-1;c.h=(Math.atan2(dy,dx)*180/Math.PI+360)%360;c.s=Math.min(1,Math.hypot(dx,dy));if(c.v<0.15)c.v=1;c.hex=hsvHex(c.h,c.s,c.v);updWheel()}

/* ---------- rounds & sessions ---------- */
const RKEY="jdg-rounds";
U.rounds={distance:[],accuracy:[],putting:[]};
try{const v=JSON.parse(localStorage.getItem(RKEY)||"null");if(v)Object.assign(U.rounds,v)}catch(e){}
function saveDrafts(){try{localStorage.setItem(RKEY,JSON.stringify(U.rounds))}catch(e){}}
const numOrNull=x=>x===undefined||x===null||x===""?null:+x;
function currentRound(type){
  if(type==="distance"){
    const rows=U.dRows.filter(r=>+r.dist>0);if(!rows.length)return null;
    if(rows.some(r=>!r.disc)&&!U.dNoDisc)return {needDisc:true};
    return {throw:U.dThrow,throws:rows.map(r=>({dist:+r.dist,disc:r.disc}))};
  }
  if(type==="accuracy"){
    const rows=accRowsCfg().map((c,i)=>{const th=numOrNull(U.acc[i]?.throws);return {dist:c.dist,throws:th==null?c.throws:th,c1:numOrNull(U.acc[i]?.c1),c2:numOrNull(U.acc[i]?.c2),closest:U.acc[i]?.closest||""}}).filter(r=>r.c1!=null||r.c2!=null||r.closest);
    return rows.length?{rows}:null;
  }
  if(!U.puttTouched)return null;
  const results=putDists().map((d,i)=>{const a=U.session[i]?.a||0,m=U.session[i]?.m||0;return {dist:d,made:m,att:Math.max(a,m)}}).filter(r=>r.att).sort((x,y)=>x.dist-y.dist);
  return results.length?{results}:null;
}
function resetCurrent(type,last){
  if(type==="distance")U.dRows=blankRows(distRowsN(),last&&last.throws?last.throws[last.throws.length-1].disc:"");
  else if(type==="accuracy"){const keep={};Object.entries(U.acc).forEach(([i,v])=>{if(v&&v.throws)keep[i]={throws:v.throws}});U.acc=keep}
  else{U.session={};U.lastPutt=null;U.puttTouched=false;fillPutters()}
}
function fillPutters(){const n=+U.putters||0,pp=S.settings.putPutts||[];putDists().forEach((d,i)=>{const a=+pp[i]||n;if(a)U.session[i]={m:0,a}})}
try{U.putters=localStorage.getItem("jdg-putters")||""}catch(e){}
fillPutters();
function saveRound(type){
  const r=currentRound(type);
  if(!r){toast(type==="distance"?"Enter at least one distance":type==="accuracy"?"Fill in at least one row first":"Enter your throws first");return}
  if(r.needDisc){askDisc("round");return}
  if(type==="accuracy"){persistAccThrows();saveSettings()}
  if(type==="putting"&&U.puttDirty){U.puttDirty=false;saveSettings()}
  U.rounds[type].push(r);resetCurrent(type,r);endRound(type);saveDrafts();U.confirm=null;render();toast("Round "+U.rounds[type].length+" saved");
  document.getElementById("sess-"+type)?.scrollIntoView({block:"center",behavior:"smooth"});
}
async function saveSession(type){
  const cur=currentRound(type);
  if(cur&&cur.needDisc){askDisc("session");return}
  if(cur&&type==="accuracy"){persistAccThrows();await saveSettings()}
  if(type==="putting"&&U.puttDirty){U.puttDirty=false;await saveSettings()}
  const rounds=U.rounds[type].slice();if(cur)rounds.push(cur);
  if(!rounds.length){toast("Save a round first");return}
  const date=(type==="distance"&&U.dDate)||today();
  let ok=true;
  if(type==="distance"){
    const session=uid();
    outer:for(let i=0;i<rounds.length;i++)for(const th of rounds[i].throws){if(!await addRec("distance",{disc:th.disc,distance:th.dist,throw:rounds[i].throw,date,session,round:i+1})){ok=false;break outer}}
  }else if(type==="accuracy"){
    const rows=rounds.flatMap((r,i)=>r.rows.map(x=>({...x,round:i+1})));
    ok=await addRec("accuracy",{date,rounds,rows,heads:accHeads()});
  }else{
    const agg={};rounds.forEach(r=>r.results.forEach(x=>{const a=agg[x.dist]||(agg[x.dist]={dist:x.dist,made:0,att:0});a.made+=x.made;a.att+=x.att}));
    ok=await addRec("putts",{date,rounds,results:Object.values(agg).sort((a,b)=>a.dist-b.dist)});
  }
  if(ok){U.rounds[type]=[];endRound(type);if(type==="distance")U.dNoDisc=false;resetCurrent(type,cur||rounds[rounds.length-1]);if(type==="accuracy")U.acc={};saveDrafts();render();toast("Session saved · "+rounds.length+" round"+(rounds.length===1?"":"s"))}
}

async function startRound(type){
  const s=getSetup(type);
  if(type==="distance"){
    const n=Math.min(50,Math.max(1,parseInt(s.throws,10)||5));
    U.dThrow=s.throw;
    const lastDisc=U.dRows.filter(r=>r.disc).pop()?.disc||"";
    U.dRows=blankRows(n,lastDisc);
    S.settings={...S.settings,distSetup:{throws:n,throw:s.throw}};
  }else if(type==="accuracy"){
    const rows=s.rows.map(r=>({dist:+r.dist,throws:Math.max(1,+r.throws||5)})).filter(r=>r.dist>0).sort((a,b)=>a.dist-b.dist);
    if(!rows.length){toast("Add at least one distance");return}
    const t={};rows.forEach(r=>t[r.dist]=r.throws);
    S.settings={...S.settings,accRows:rows,accDistances:rows.map(r=>r.dist),accThrows:{...(S.settings.accThrows||{}),...t}};
    U.acc={};rows.forEach((r,i)=>U.acc[i]={throws:String(r.throws)});
  }else{
    const p=Math.max(0,parseInt(s.putters,10)||0);
    const rows=s.rows.map(r=>({dist:+r.dist,putts:Math.max(0,parseInt(r.putts,10)||0)||p})).filter(r=>r.dist>0&&r.dist<=100).sort((a,b)=>a.dist-b.dist);
    if(!rows.length){toast("Add at least one distance");return}
    U.putters=p||"";try{localStorage.setItem("jdg-putters",String(p||""))}catch(e){}
    S.settings={...S.settings,putDistances:rows.map(r=>r.dist),putPutts:rows.map(r=>r.putts||null),putters:p||null};
    U.session={};U.puttTouched=false;fillPutters();
  }
  U.active[type]=true;U.setup[type]=null;U.confirm=null;
  await saveSettings();
  const first=type==="distance"?"dr-dist-0":type==="accuracy"?null:"pm-0";
  if(first)setTimeout(()=>document.getElementById(first)?.focus(),50);
}

/* ---------- flight chart ---------- */
// Stability adjustments: extra fade (shorter) for stable/overstable, extra turn (a bit longer) for understable
const STAB_MOD={"Very understable":{turn:2,fade:-2,dist:0.06},"Understable":{turn:1,fade:-1,dist:0.03},"Straight":{turn:0,fade:0,dist:0},"Stable":{turn:-1,fade:1,dist:-0.03},"Overstable":{turn:-2,fade:2,dist:-0.06}};
// [key, name, max distance ft, speed where that arm tops out, short label]
// How strongly a disc reacts to arm power: understable discs turn over more, overstable discs resist
const STAB_RES={"Very understable":1.5,"Understable":1.25,"Straight":1,"Stable":0.75,"Overstable":0.5};
const LEVEL_TURN={beginner:0,intermediate:0.25,advanced:0.5,pro:0.75,elite:1};
const LEVELS=[["beginner","Beginner",250,9,"Beginner"],["intermediate","Intermediate",325,11,"Interm."],["advanced","Advanced",400,12,"Advanced"],["pro","Pro",475,13,"Pro"],["elite","Elite",550,14,"Elite"]];
const LEVEL_RANGE={beginner:"150–250",intermediate:"250–325",advanced:"325–400",pro:"400–475",elite:"475–550+"};
const LINE_COLORS=["#e8631c","#1f4fbf","#2f8a4e","#b83a32","#7d4bc4","#0f8b8d","#c2185b","#8d6e00","#5d6d7e","#d4a017"];
try{const v=JSON.parse(localStorage.getItem("jdg-chart")||"null");if(v){U.level=v.level;U.hand=v.hand;U.chartType=v.type}}catch(e){}
U.level=U.level||"intermediate";U.hand=U.hand||"R";
const saveChartPrefs=()=>{try{localStorage.setItem("jdg-chart",JSON.stringify({level:U.level,hand:U.hand,type:U.chartType}))}catch(e){}};
const MY_FLIGHT=[["","Use flight numbers"],["hookhard","Hooks hard left",-30],["fade","Fades left",-15],["straight","Flies straight",0],["turn","Turns right",15],["turnhard","Turns hard right",30]];
const statusLevel=k=>(LEVELS.find(l=>l[0]===k)||[k,k])[1];
const myLevel=()=>S.settings.myLevel||"advanced";
function rawFlight(d,level){
  const L=LEVELS.find(l=>l[0]===level)||LEVELS[1],max=L[2],cap=L[3];
  const sp=Math.max(1,Math.min(15,+d.speed||5)),gl=d.glide==null||d.glide===""?4:+d.glide;
  const base=x=>0.4+0.6*(x-1)/12;           // share of max distance by disc speed
  const eff=sp<=cap?sp:cap-(sp-cap)*0.5;     // discs too fast for the arm lose distance
  const m=STAB_MOD[d.stability]||{fade:0,turn:0,dist:0};
  const dist=Math.round(Math.min(600,max*base(eff)/base(cap)*(1+(gl-4)*0.02)*(1+m.dist)));
  // Arm power vs disc speed: more power than the disc needs adds turn (flies more understable);
  // less power takes turn away and adds fade (flies more overstable).
  // Stability and glide decide how much a disc reacts.
  const res=(STAB_RES[d.stability]??1)*(1+(gl-4)*0.15),power=cap-sp;
  let turn=(+d.turn||0)-m.turn,fade=Math.max(0,(+d.fade||0)+m.fade);
  // Players don't throw slower discs at full power, so extra turn depends on the arm level, not the speed gap
  if(power>=0)turn-=Math.min(1.5,(LEVEL_TURN[level]??0.5)*res);
  else{turn*=Math.max(0,1+power*0.25);fade+=Math.min(3,-power*0.8/Math.max(0.5,res))}
  const turnFt=-turn*5;                      // each -1 turn = 5 ft right
  const fadePer=(-turn>fade)?5:10;           // more turn than fade: each fade only brings it back 5 ft
  return {dist,turnFt,endFt:turnFt-fade*fadePer};

function flightOf(d,level){
  const r=rawFlight(d,level);
  // If you've said how this disc flies for you, line the chart up with that at your level,
  // then let the arm-power model move it from there for other levels.
  const mf=MY_FLIGHT.find(x=>x[0]===d.myFlight);
  if(mf&&mf[0]){const mine=rawFlight(d,myLevel()),shift=mf[2]-mine.endFt;r.turnFt+=shift*0.6;r.endFt+=shift;r.calibrated=true}
  r.turnFt=Math.round(r.turnFt);r.endFt=Math.round(r.endFt);
  return r;
}
function curve(pts){let p=`M${pts[0][0].toFixed(1)},${pts[0][1].toFixed(1)}`;
  for(let i=0;i<pts.length-1;i++){const p0=pts[i-1]||pts[i],p1=pts[i],p2=pts[i+1],p3=pts[i+2]||p2;
    const c1=[p1[0]+(p2[0]-p0[0])/6,p1[1]+(p2[1]-p0[1])/6],c2=[p2[0]-(p3[0]-p1[0])/6,p2[1]-(p3[1]-p1[1])/6];
    p+=` C${c1[0].toFixed(1)},${c1[1].toFixed(1)} ${c2[0].toFixed(1)},${c2[1].toFixed(1)} ${p2[0].toFixed(1)},${p2[1].toFixed(1)}`}return p}

/* ---------- results ---------- */
function hbar(label,valueTxt,frac,sub){return `<div class="hb"><div class="row between"><span class="dname" style="font-size:15px">${label}</span><span class="num"><strong>${valueTxt}</strong></span></div>
  <div class="bar"><i style="width:${Math.max(0,Math.min(100,frac*100))}%"></i></div>${sub?`<div class="small muted">${sub}</div>`:""}</div>`}
const avg=a=>a.length?a.reduce((s,x)=>s+x,0)/a.length:0;
const r1=x=>Math.round(x*10)/10;
const noData=(t,m)=>`<div class="empty"><strong>${t}</strong>${m}</div>`;
function resultsView(){
  const sec=U.rsec||"distance";
  const seg=[["distance","Distance"],["accuracy","Accuracy"],["putting","Putting"]];
  return `<h2>Results</h2>
  <div class="seg" role="group" aria-label="Results type">${seg.map(([k,l])=>`<button data-rsec="${k}" aria-pressed="${sec===k}">${l}</button>`).join("")}</div>
  ${sec==="distance"?distResults():sec==="accuracy"?accResults():puttResults()}
  ${backupPanel()}`;
}
function distResults(){
  const L=S.distance.filter(l=>l.distance>0);
  if(!L.length)return noData("No distance data yet","Save a distance session to see averages, longest throws and your furthest discs.");
  const groups={};L.forEach(l=>{const k=l.session||("d"+l.date);(groups[k]||(groups[k]={date:l.date,list:[]})).list.push(l)});
  const sess=Object.values(groups).sort((a,b)=>(b.date||"").localeCompare(a.date||""));
  const maxAll=Math.max(...L.map(l=>l.distance));
  const top=L.slice().sort((a,b)=>b.distance-a.distance).slice(0,10);
  const byDisc={};L.filter(l=>l.disc).forEach(l=>(byDisc[l.disc]||(byDisc[l.disc]=[])).push(l.distance));
  const discs=Object.entries(byDisc).map(([id,a])=>({id,max:Math.max(...a),avg:avg(a),n:a.length})).sort((a,b)=>b.max-a.max);
  return `<div class="stats">
    <div class="stat"><div class="k">Longest throw</div><div class="big">${maxAll}<small>ft</small></div></div>
    <div class="stat"><div class="k">Average throw</div><div class="big">${Math.round(avg(L.map(l=>l.distance)))}<small>ft</small></div></div>
    <div class="stat"><div class="k">Throws logged</div><div class="big">${L.length}</div></div></div>
  <div class="panel"><h3>Average per session</h3>${sess.map(s=>{const a=avg(s.list.map(l=>l.distance));
    return hbar(fmtDate(s.date),Math.round(a)+" ft",a/maxAll,`${s.list.length} throw${s.list.length===1?"":"s"} · longest ${Math.max(...s.list.map(l=>l.distance))} ft`)}).join("")}</div>
  <div class="panel"><h3>Longest throws</h3><ol class="rank">${top.map(l=>`<li><span class="dname" style="font-size:15px">${esc(discName(l.disc))}<span class="small muted"> · ${esc(l.throw)} · ${fmtDate(l.date)}</span></span><span class="big">${l.distance}<small>ft</small></span></li>`).join("")}</ol></div>
  <div class="panel"><h3>Furthest flying discs</h3>${discs.map(d=>hbar(esc(discName(d.id)),d.max+" ft",d.max/maxAll,`avg ${Math.round(d.avg)} ft over ${d.n} throw${d.n===1?"":"s"}`)).join("")}</div>`;
}
function accResults(){

    if(r.closest&&typeof r.closest==="string")cnt[r.closest]=(cnt[r.closest]||0)+1;
    const p=perDist[r.dist]||(perDist[r.dist]={c1:[],c2:[],close:{}});

}

}
app.addEventListener("change",e=>{const t=e.target;if(!t.dataset||!t.dataset.bkfile||!t.files||!t.files[0])return;
  const r=new FileReader();r.onload=()=>{const v=parseBackup(String(r.result));if(v){U.bkPending=v;U.bkOpen=true;render()}};r.readAsText(t.files[0])});
app.addEventListener("toggle",e=>{if(e.target.classList&&e.target.classList.contains("backup"))U.bkOpen=e.target.open},true);
async function backupAction(a){
  if(a==="bkDownload"){const txt=JSON.stringify(backupData(),null,1),name="jdg-backup-"+today()+".json";
    try{const dl=window.claude?await window.claude.use("downloads"):null;if(dl){await dl.save({filename:name,data:txt});toast("Backup saved");return}}catch(e){}
    try{const url=URL.createObjectURL(new Blob([txt],{type:"application/json"}));const a2=document.createElement("a");a2.href=url;a2.download=name;document.body.appendChild(a2);a2.click();a2.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);toast("Backup downloading")}
    catch(e){U.bkText=txt;render();toast("Use Copy backup instead")}return true}
  if(a==="bkCopy"){const txt=JSON.stringify(backupData());U.bkText=txt;
    try{await navigator.clipboard.writeText(txt);toast("Backup copied")}catch(e){render();const ta=document.getElementById("bk-out");if(ta){ta.focus();ta.select()}toast("Select the text and copy it");return true}
    render();return true}
  if(a==="bkPaste"){U.bkPasting=!U.bkPasting;render();setTimeout(()=>document.getElementById("bk-in")?.focus(),30);return true}
  if(a==="bkReadPaste"){const v=parseBackup(document.getElementById("bk-in")?.value||"");if(v){U.bkPending=v;render()}return true}
  if(a==="bkCancel"){U.bkPending=null;render();return true}
  if(a==="bkRestore"){await restoreBackup(U.bkPending);return true}
}

/* ---------- boot ---------- */
localLoad();render();setTimeout(focusQuick,300);
(async()=>{
  try{
    const d=await window.claude?.use?.("db");
    if(!d)return;
    const user=await window.claude.use("user");
    const canWrite=user?await user.can("data.write"):null;
    if(canWrite===false)readOnly=true;
    db=d;
    COLLS.forEach(c=>db.collection(c).onSnapshot(s=>{S[c]=s.docs.map(x=>({id:x.id,...x.data()}));render()},()=>{}));
    db.doc("settings/main").onSnapshot(s=>{S.settings=s.exists?{putDistances:DEFAULT_PUTTS.slice(),...s.data()}:{putDistances:DEFAULT_PUTTS.slice()};render()},()=>{});
  }catch(e){}
})();
</script>

<script>
if("serviceWorker" in navigator){window.addEventListener("load",()=>{navigator.serviceWorker.register("sw.js").catch(()=>{})})}
</script>
